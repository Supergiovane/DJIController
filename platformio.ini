[platformio]
default_envs = esp32dev

[env]
test_framework = unity

; Firmware for a classic ESP32 dev board with an SN65HVD230 CAN transceiver.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCAN_TX_PIN=5
    -DCAN_RX_PIN=4
    -DWIFI_HOSTNAME=\"djicontroller\"
    -DWIFI_AP_SSID=\"DJIController\"
    -DWIFI_AP_PASSWORD=\"djigimbal\"

; Host-side unit tests for the protocol library: `pio test -e native`.
[env:native]
platform = native
build_flags = -std=c++17
build_src_filter = -<*>
