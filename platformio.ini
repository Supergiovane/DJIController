[platformio]
default_envs = esp32dev

[env]
test_framework = unity

; Settings shared by every ESP32 firmware build.
[firmware]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/embed_web.py
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DWIFI_HOSTNAME=\"djicontroller\"
    -DWIFI_AP_SSID=\"DJIController\"
    ; Empty = open network. Set 8+ characters to require a password.
    -DWIFI_AP_PASSWORD=\"\"

; Classic ESP32 dev board with an external SN65HVD230 CAN transceiver.
[env:esp32dev]
extends = firmware
board = esp32dev
build_flags =
    ${firmware.build_flags}
    -DCAN_TX_PIN=5
    -DCAN_RX_PIN=4

; LilyGO T-CAN485: ESP32 with an onboard SN65HVD231 transceiver and a 7-12 V input.
; Pins from the board's factory firmware (its config.h has TX/RX swapped). GPIO23 drives the transceiver's
; Rs pin and must be low for high-speed mode.
[env:tcan485]
extends = firmware
board = esp32dev
build_flags =
    ${firmware.build_flags}
    -DCAN_TX_PIN=27
    -DCAN_RX_PIN=26
    -DCAN_STANDBY_PIN=23

; Host-side unit tests for the protocol library: `pio test -e native`.
[env:native]
platform = native
build_flags = -std=c++17
build_src_filter = -<*>
