[platformio]
default_envs = esp32dev

[env]
test_framework = unity

; Firmware for a classic ESP32 dev board with an SN65HVD230 CAN transceiver.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/embed_web.py
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCAN_TX_PIN=5
    -DCAN_RX_PIN=4
    -DWIFI_HOSTNAME=\"djicontroller\"
    -DWIFI_AP_SSID=\"DJIController\"
    ; Empty = open network. Set 8+ characters to require a password.
    -DWIFI_AP_PASSWORD=\"\"

; Host-side unit tests for the protocol library: `pio test -e native`.
[env:native]
platform = native
build_flags = -std=c++17
build_src_filter = -<*>
